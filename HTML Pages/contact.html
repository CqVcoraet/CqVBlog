<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/contact.css">
    <script src="../Scripts/CustomAlert.js" defer></script>
    <script type="module" src="../Scripts/CreatePostView.js"></script>
    <script type="module" src="../Scripts/main.js"></script>
    <script src="../Scripts/Post.js" defer></script>
    <title>CqVBlog</title>
</head>
<body>
    <div class="top-bar">
        <div class="nav-bar">
            <div class="nav-item"><a class="nav-link" href="index.html">Home</a></div>
            <div class="nav-item"><a class="nav-link" href="about.html">About</a></div>
            <div class="nav-item"><a class="nav-link" href="blog.html">Blog</a></div>
            <div class="nav-item"><a class="nav-link" href="projects.html">Projects</a></div>
            <div class="nav-item active"><a class="nav-link" href="contact.html">Contact</a></div>
            <div class="nav-item"><a class="nav-link" href="settings.html">Settings</a></div>
        </div>

        <div class="sign-in-btn">Sign In</div>
        <div class="create-post">Create Post</div>
    </div>

    <main class="contact-page">
        <div class="contact-header">
            <h1>Contact Us</h1>
            <p>Have a question or issue? Send a message and I will get back to you.</p>
        </div>

        <form class="contact-form">
            <div class="form-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="form-field">
                <label for="topic">Topic</label>
                <input id="topic" name="topic" type="text" placeholder="Enter your topic" required>
            </div>

            <div class="form-field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Describe your issue" rows="8" required></textarea>
            </div>

            <button class="contact-submit" type="submit">Send Message</button>
        </form>
    </main>
</body>
</html>
